# EBS disk type for the database. Needs the aws-ebs-csi-driver add-on (created by Terraform in eks.tf).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer # create the disk in the same zone as the pod
allowVolumeExpansion: true
reclaimPolicy: Delete # the demo is deleted afterwards, so the disk goes too. Use Retain for real data.
