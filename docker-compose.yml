# Run the app:            docker compose up -d --build
# App + monitoring:       docker compose --profile monitoring up -d --build
# Stop everything:        docker compose --profile monitoring down

services:
  # The one and only database. The app itself keeps no data, so it can run as many copies as you like.
  db:
    image: postgres:16-alpine
    container_name: devagent-db
    environment:
      POSTGRES_USER: devagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devagent}
      POSTGRES_DB: devagent
    ports:
      - "127.0.0.1:${DB_PORT:-5440}:5432" # only for running tests and npm run dev on this machine
    volumes:
      - devagent-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devagent -d devagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-local}
    image: devagent:${TAG:-local}
    container_name: devagent
    ports:
      - "${PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgres://devagent:${POSTGRES_PASSWORD:-devagent}@db:5432/devagent
      BASE_URL: ${BASE_URL:-http://localhost:3100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-devagent-verify}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
      RESCUE_WEBHOOK_SECRET: ${RESCUE_WEBHOOK_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DEV_BILLING: ${DEV_BILLING:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: devagent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    container_name: devagent-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Demo setup: anyone on this machine can view dashboards. Turn off for a real server.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  devagent-pg:
  prometheus-data:
  grafana-data:
